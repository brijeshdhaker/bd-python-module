[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[project]
name = "pyspark-module"
description = "pyspark-module"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.3.2",
    # "databricks-dlt",
    # "databricks-connect>=15.4,<15.5",
    # "databricks-langchain>=0.14.0",
    # "databricks-sdk[notebook]>=0.119.0",
    # "databricks-sql-connector[pyarrow]>=4.3.0",
    # "databricks-sqlalchemy>=2.0.9",
    # "unitycatalog-ai[databricks]>=0.3.2",
]

[project.scripts]
pywhl-main = "pyspark_module.main:main"

[tool.uv.sources]


[tool.pytest.ini_options]
#addopts = "--maxfail=1"
addopts = "--no-header"
cache_dir = "./.pytest_cache"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "anomaly: marks tests as anomaly detection tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
pythonpath = [
    "src"
]