# This is a Declarative Automation Bundle definition for databricks-ai-playground.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bd_python_module
  uuid: 60f10c32-9334-4f7f-9b11-d829da36a95f

include:
  - resources/jobs/*.yml
  - resources/pipeline/*.yml

# These are any additional files or paths to include or exclude.
# sync:
#   include:
#     - '<some-file-or-path-glob-to-include>'
#     - '<another-file-or-path-glob-to-include>'
#   exclude:
#     - '<some-file-or-path-glob-to-exclude>'
#     - '<another-file-or-path-glob-to-exclude>'
#   paths:
#     - '<some-file-or-path-to-synchronize>'

# These are the default artifact settings if not otherwise overridden in
# the targets top-level mapping.
artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel
    path: .
    dynamic_version: false
    executable: bash    
    files:
      - source: string    

# These are the permissions to apply to resources defined
# in the resources mapping.
# This is the identity to use to run the bundle
run_as:
  user_name: "brijeshdhaker@gmail.com"
  # - service_principal_name: "71c395f1-3b2a-4234-9194-86b0e2805262"

# These are the permissions to apply to resources defined
# in the resources mapping.  CAN_CREATE CAN_VIEW CAN_RUN, CAN_MANAGE CAN_EDIT CAN_READ CAN_USE
# permissions:
#   - level: "CAN_MANAGE"
#     group_name: "admins"
#   - level: "CAN_MANAGE"
#     user_name: "brijeshdhaker@gmail.com"
#   - level: "CAN_MANAGE"
#     service_principal_name: "211d31e8-a436-415a-b99c-541379021a3e"

# Variable declarations. These variables are assigned in the dev/prod targets below.    
variables:
  catalog:
    description: The catalog to use
    default: "workspace"
  schema:
    description: The schema to use
    default: "default"
  lakebase_project_id:
    description: "Lakebase Project ID"
    default: "databricks-ai-playground"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    # ${workspace.current_user.short_name}  
    mode: production
    default: true
    variables:
      catalog: workspace
      schema: default
    workspace:
      host: https://dbc-ad78fc43-bcc0.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/apps/bd_python_module
      
  ## Optionally, there could be 'staging' or 'prod' targets here.
  prod:
    variables:
      catalog: workspace
      schema: default  
    workspace:
      host: https://dbc-ad78fc43-bcc0.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/apps/bd_python_module
    permissions:
      - user_name: brijeshdhaker@gmail.com
        level: CAN_MANAGE


